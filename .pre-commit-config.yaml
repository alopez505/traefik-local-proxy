repos:
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      # The mise-pinned binary (mise.toml); the upstream hook builds gitleaks with Go.
      - id: gitleaks
        name: gitleaks
        entry: mise exec -- gitleaks git --pre-commit --redact --staged --verbose --no-banner
        language: system
        pass_filenames: false
