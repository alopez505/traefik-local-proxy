# HTTP-only development mode. It is self-contained so it can be validated as
# ordinary YAML and does not inherit HTTPS ports or certificate mounts.
# Start with: docker compose -f docker-compose.http.yml up -d

services:
  proxy:
    image: traefik:v3.7.9
    container_name: traefik-local
    restart: unless-stopped
    command:
      - "--global.sendanonymoususage=false"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--ping=true"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.allowemptyservices=true"
      - '--providers.docker.defaultrule=Host(`{{ index .Labels "traefik.hostname" }}.localtest.me`)'
      - "--providers.docker.network=${TRAEFIK_NETWORK_NAME:-proxy}"
      - "--entrypoints.web.address=:80"
      # Single-file dynamic config, unlike the HTTPS mode's whole-directory
      # provider - HTTP-only mode has no TLS to configure, so only the
      # backend-TLS-compatibility transport (see README "Backend TLS
      # compatibility") is loaded here, never dynamic/tls.yml.
      - "--providers.file.filename=/etc/traefik/dynamic/serverstransport.yml"
      - "--providers.file.watch=true"
    depends_on:
      - socket-proxy
    labels:
      # Set TRAEFIK_DASHBOARD_ENABLED=false to fully disable this router - it
      # is the only path to both the dashboard UI and the API (api@internal).
      traefik.enable: "${TRAEFIK_DASHBOARD_ENABLED:-true}"
      traefik.http.routers.proxy.rule: "Host(`proxy.localtest.me`)"
      traefik.http.routers.proxy.entrypoints: "web"
      traefik.http.routers.proxy.tls: "false"
      traefik.http.routers.proxy.service: "api@internal"
    ports:
      - "${TRAEFIK_WEB_BIND_ADDRESS:-127.0.0.1}:${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./dynamic/serverstransport.yml
        target: /etc/traefik/dynamic/serverstransport.yml
        read_only: true
        bind:
          create_host_path: false
    networks:
      - proxy
      - socket-proxy-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: traefik-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-net

networks:
  proxy:
    name: ${TRAEFIK_NETWORK_NAME:-proxy}
  socket-proxy-net:
    internal: true
