# HTTP-only development mode. It is self-contained so it can be validated as
# ordinary YAML and does not inherit HTTPS ports or certificate mounts.
# Start with: docker compose -f docker-compose.http.yml up -d

services:
  proxy:
    image: traefik:v3.7.9
    container_name: traefik-local
    restart: unless-stopped
    command:
      - "--global.sendanonymoususage=false"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--ping=true"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.allowemptyservices=true"
      - '--providers.docker.defaultrule=Host(`{{ index .Labels "traefik.hostname" }}.localtest.me`)'
      - "--providers.docker.network=${TRAEFIK_PROXY_NETWORK:-proxy}"
      - "--entrypoints.web.address=:80"
    depends_on:
      - socket-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.proxy.rule: "Host(`proxy.localtest.me`)"
      traefik.http.routers.proxy.entrypoints: "web"
      traefik.http.routers.proxy.tls: "false"
      traefik.http.routers.proxy.service: "api@internal"
    ports:
      - "127.0.0.1:${TRAEFIK_HTTP_PORT:-80}:80"
    networks:
      - proxy
      - socket-proxy-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2
    container_name: traefik-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-net

networks:
  proxy:
    name: ${TRAEFIK_PROXY_NETWORK:-proxy}
  socket-proxy-net:
    internal: true
