# =============================================================================
#  mise - task runner for traefik-local-proxy.
#  Install mise: https://mise.jdx.dev
#  List tasks:   mise tasks
# =============================================================================

[tools]
uv = "0.10.10"
# mkcert generates the local dev CA and wildcard cert (see tasks."certificates:generate").
mkcert = "1.4.4"

[tasks.up]
description = "Start Traefik (creates proxy network if needed)"
run = "./scripts/check-exposure.sh; docker compose up -d"

[tasks.up-http]
description = "Start Traefik without local TLS certificates"
run = "docker compose -f docker-compose.http.yml up -d"

[tasks.down]
description = "Stop Traefik and remove the compose-owned proxy network"
run = "docker compose down"

[tasks.stop]
description = "Stop Traefik while keeping the proxy network"
run = "docker compose stop"

[tasks.restart]
description = "Restart Traefik (use 'up' to apply config/port changes)"
run = "docker compose restart proxy"

[tasks.logs]
description = "Follow Traefik logs (Ctrl-C to exit)"
run = "docker compose logs -f"

[tasks.ps]
description = "Show Traefik service status"
run = "docker compose ps"

[tasks.update]
description = "Pull images and apply the HTTPS proxy configuration"
run = "docker compose pull && docker compose up -d"

[tasks.update-http]
description = "Pull images and apply the HTTP-only proxy configuration"
run = "docker compose -f docker-compose.http.yml pull && docker compose -f docker-compose.http.yml up -d"

[tasks."certificates:generate"]
description = "Generate wildcard cert via mkcert (skips if already present)"
run = "./scripts/generate-dev-certs.sh"

[tasks."certificates:verify"]
description = "Verify the configured certificate/key: expiry, SAN, pairing, chain, permissions"
env = { _.file = ".env" }
run = """
./scripts/verify-certs.sh \
  --cert "${TRAEFIK_CERTIFICATE_FILE:-./certs/localtest.me.crt}" \
  --key "${TRAEFIK_CERTIFICATE_KEY_FILE:-./certs/localtest.me.key}"
"""

[tasks."certificates:import-from-image"]
description = "Import a certificate/key pair from a container image without starting it"
run = "./scripts/import-certs-from-image.sh"

[tasks."certificates:replace-ca"]
description = "Untrust the old Windows CA, replace it, and trust the current mkcert CA"
run = """
CAROOT="$(mkcert -CAROOT)"
if [ ! -f certs/ca.crt ]; then
	echo 'certs/ca.crt is missing; there is no stored CA to rotate.' >&2
	exit 1
fi
if [ -f "$CAROOT/rootCA.pem" ] && cmp -s certs/ca.crt "$CAROOT/rootCA.pem"; then
	echo 'certs/ca.crt already matches the current mkcert CA; rotation is unnecessary.' >&2
	exit 1
fi
mise run certificates:untrust-ca &&
./scripts/generate-dev-certs.sh --replace-ca &&
mise run certificates:trust-ca
"""

[tasks.config]
description = "Validate the rendered compose config"
run = "docker compose config -q && echo 'Config OK'"

[tasks.validate]
description = "Full local gate: pre-commit hooks + all compose configs"
run = """
git rev-parse --is-inside-work-tree >/dev/null 2>&1 || {
	echo 'Validation must run inside a git repository (.git missing). Clone the repo or run git init first.'
	exit 1
}
uvx pre-commit==4.2.0 run --all-files &&
docker compose --env-file .env.example config -q &&
docker compose --env-file .env.example -f docker-compose.http.yml config -q &&
docker compose --env-file .env.example -f examples/whoami/docker-compose.yml config -q &&
docker compose --env-file .env.example -f examples/whoami/docker-compose.http.yml config -q &&
TRAEFIK_IMAGE=traefik:v3.7.9 docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.use-custom-traefik-image.yml config -q &&
docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.mssql.yml config -q &&
docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.postgres.yml config -q &&
docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.mysql.yml config -q &&
docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.neo4j.yml config -q &&
./scripts/test-generate-dev-certs.sh &&
./scripts/test-verify-certs.sh &&
./scripts/test-import-certs-from-image.sh &&
./scripts/test-check-exposure.sh &&
./scripts/check-exposure.sh &&
echo 'Validation OK'
"""

[tasks.network]
description = "Show containers currently attached to proxy"
run = """
docker network inspect proxy --format '{{range .Containers}}{{println .Name}}{{end}}' 2>/dev/null || echo "proxy network not yet created (run: mise run up)"
"""

[tasks.demo]
description = "Start whoami test service at https://demo.localtest.me"
run = """
if [ -f .env ]; then
	docker compose --env-file .env -f examples/whoami/docker-compose.yml up -d
else
	docker compose -f examples/whoami/docker-compose.yml up -d
fi
"""

[tasks.demo-http]
description = "Start whoami test service at http://demo.localtest.me"
run = """
if [ -f .env ]; then
	docker compose --env-file .env -f examples/whoami/docker-compose.http.yml up -d
else
	docker compose -f examples/whoami/docker-compose.http.yml up -d
fi
"""

[tasks.demo-down]
description = "Stop the whoami test service"
run = """
if [ -f .env ]; then
	docker compose --env-file .env -f examples/whoami/docker-compose.yml down
else
	docker compose -f examples/whoami/docker-compose.yml down
fi
"""

[tasks.smoke]
description = "Run live HTTPS/HTTP mode-transition and custom-port smoke tests"
run = "./scripts/smoke-test.sh"

[tasks."certificates:trust-ca"]
description = "Import dev CA into Windows CurrentUser trust store (WSL2 -> Windows, no admin required)"
run = """
POWERSHELL="${POWERSHELL:-powershell.exe}"
if ! command -v "$POWERSHELL" >/dev/null 2>&1 && ! test -x "$POWERSHELL"; then
	POWERSHELL="/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe"
fi
if ! command -v "$POWERSHELL" >/dev/null 2>&1 && ! test -x "$POWERSHELL"; then
	echo 'Windows PowerShell was not found. Ensure WSL can access /mnt/c.' >&2
	exit 1
fi
"$POWERSHELL" -NoProfile -ExecutionPolicy Bypass -File scripts/trust-ca-windows.ps1
"""

[tasks."certificates:untrust-ca"]
description = "Remove dev CA from Windows CurrentUser trust store"
run = """
POWERSHELL="${POWERSHELL:-powershell.exe}"
if ! command -v "$POWERSHELL" >/dev/null 2>&1 && ! test -x "$POWERSHELL"; then
	POWERSHELL="/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe"
fi
if ! command -v "$POWERSHELL" >/dev/null 2>&1 && ! test -x "$POWERSHELL"; then
	echo 'Windows PowerShell was not found. Ensure WSL can access /mnt/c.' >&2
	exit 1
fi
"$POWERSHELL" -NoProfile -ExecutionPolicy Bypass -File scripts/untrust-ca-windows.ps1
"""
