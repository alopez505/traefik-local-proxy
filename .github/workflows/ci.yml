name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise itself is not version-pinned: mise.toml floors it (min_version)
      # and pins everything it installs, so the binary is a task dispatcher,
      # not part of what validate asserts. minimum_release_age keeps CI off
      # same-day releases so a bad one is caught upstream, not here.
      - name: Install mise and pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          minimum_release_age: 7d
          # v4.3.0 has no default for this input (added upstream later);
          # without it the age-filtered release lookup and mise's own
          # GitHub-hosted tool downloads run unauthenticated (rate-limit flaky)
          github_token: ${{ github.token }}

      # Same gate as local development: pre-commit hooks (shellcheck,
      # gitleaks), every compose config, parity checks, regression tests.
      # Task definition: mise.toml [tasks.validate].
      - name: Validate
        run: mise run validate

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HTTPS/HTTP transition and custom-port smoke tests
        run: ./scripts/smoke-test.sh

      - name: Hostname fallback smoke tests
        run: ./scripts/smoke-test-fallback.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null
              $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
              exit 1
          }

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
              # PSResourceGet ships with PowerShell 7 on windows-latest and needs
              # no NuGet package-provider bootstrap (which fails on the runner).
              Install-PSResource PSScriptAnalyzer -Version '[1.25.0]' -Repository PSGallery -TrustRepository -Reinstall -Scope CurrentUser
          } else {
              [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
              Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          }

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error, Warning
          if ($results.Count -gt 0) {
              $results | Format-Table -AutoSize | Out-String | Write-Error
              exit 1
          }

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Secret scan
        run: gitleaks detect --source . --verbose --redact
