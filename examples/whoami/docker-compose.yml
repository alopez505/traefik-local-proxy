# =============================================================================
#  whoami - minimal test service that echoes HTTP request details.
#
#  Usage:
#    mise run demo          # start via mise
#    # or:
#    docker compose -f examples/whoami/docker-compose.yml up -d
#
#  Then open https://demo.localtest.me in your browser.
#  Stop with:
#    docker compose -f examples/whoami/docker-compose.yml down
#
#  Requires traefik-local-proxy to be running first (mise run up).
# =============================================================================

services:
  whoami:
    image: traefik/whoami:v1.11.0
    container_name: traefik-whoami-demo
    restart: unless-stopped
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.hostname: "demo"
      traefik.http.routers.demo.entrypoints: "websecure"
      traefik.http.routers.demo.tls: "true"
      traefik.http.services.demo.loadbalancer.server.port: "80"

networks:
  proxy:
    external: true
    name: proxy
