# HTTP-only demo service for the HTTP proxy mode.

services:
  whoami:
    image: traefik/whoami:v1.11.0
    container_name: traefik-whoami-demo
    restart: unless-stopped
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.hostname: "demo"
      traefik.http.routers.demo.entrypoints: "web"
      traefik.http.services.demo.loadbalancer.server.port: "80"

networks:
  proxy:
    external: true
    name: ${TRAEFIK_PROXY_NETWORK:-proxy}
