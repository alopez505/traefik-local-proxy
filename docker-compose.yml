# =============================================================================
#  Traefik local reverse proxy
# -----------------------------------------------------------------------------
#  HTTPS-first local proxy for Docker development on *.localtest.me.
#  localtest.me is a public wildcard DNS that resolves to 127.0.0.1, so
#  browsers reach Traefik running in WSL2 without /etc/hosts changes.
#
#  First-time setup:
#    cp .env.example .env               # optional: override ports, bind addresses, log level
#    mise run certificates:generate     # generate local CA + wildcard cert
#    mise run certificates:trust-ca     # import CA into Windows CurrentUser trust store
#    mise run up                        # start Traefik
#    mise run demo                      # start demo service
#    # Dashboard: https://proxy.localtest.me
#
#  Services that want Traefik routing join the shared proxy network:
#    networks:
#      proxy:
#        external: true
#        name: proxy
#    labels:
#      traefik.enable: "true"
#      traefik.hostname: "myapp"
#      traefik.http.routers.myapp.entrypoints: "websecure"
#      traefik.http.routers.myapp.tls: "true"
#      # Explicit backend port; required when Traefik cannot infer one.
#      traefik.http.services.myapp.loadbalancer.server.port: "<container_port>"
# =============================================================================

services:
  proxy:
    # Deliberately pinned and tested here, not an arbitrary version. Bump only
    # after `mise run validate` and `mise run smoke` pass against the new tag.
    image: traefik:v3.7.12
    container_name: proxy
    restart: unless-stopped
    # Traefik treats file, CLI, and environment install configuration as
    # mutually exclusive sources, so keep this service CLI-only.
    command:
      - "--global.sendanonymoususage=false"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--ping=true"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
      - "--providers.docker=true"
      # Route Docker discovery through socket-proxy instead of mounting the
      # Docker socket into Traefik.
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.allowemptyservices=true"
      # Hostname resolution order: traefik.hostname label (always checked
      # first) -> Compose service name if TRAEFIK_FALLBACK_TO_COMPOSE_SERVICE_NAME=true
      # -> container name if TRAEFIK_FALLBACK_TO_CONTAINER_NAME=true -> no
      # route. Fallback tiers are normalized (normalize); an explicit
      # traefik.hostname label never is. This exact string must stay
      # identical in docker-compose.http.yml - see the CI parity check.
      - '--providers.docker.defaultrule={{ if index .Labels "traefik.hostname" }}Host(`{{ index .Labels "traefik.hostname" }}.localtest.me`){{ else if and (eq "${TRAEFIK_FALLBACK_TO_COMPOSE_SERVICE_NAME:-false}" "true") (index .Labels "com.docker.compose.service") }}Host(`{{ normalize (index .Labels "com.docker.compose.service") }}.localtest.me`){{ else if and (eq "${TRAEFIK_FALLBACK_TO_CONTAINER_NAME:-false}" "true") (trimPrefix "/" .ContainerName) }}Host(`{{ normalize (trimPrefix "/" .ContainerName) }}.localtest.me`){{ else }}{{ end }}'
      - "--providers.docker.network=${TRAEFIK_NETWORK_NAME:-proxy}"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # Traefik sees the container's :443 entrypoint, so explicitly use the
      # published host HTTPS port when constructing HTTP redirects.
      - "--entrypoints.web.http.redirections.entrypoint.to=:${TRAEFIK_HTTPS_PORT:-443}"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=false"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.neo4j.address=:7687"
      - "--entrypoints.mssql.address=:1433"
      - "--entrypoints.mysql.address=:3306"
      - "--entrypoints.postgres.address=:5432"
    depends_on:
      - socket-proxy
    labels:
      # Set TRAEFIK_DASHBOARD_ENABLED=false to fully disable this router - it
      # is the only path to both the dashboard UI and the API (api@internal).
      traefik.enable: "${TRAEFIK_DASHBOARD_ENABLED:-true}"
      traefik.http.routers.proxy.rule: "Host(`proxy.localtest.me`)"
      traefik.http.routers.proxy.entrypoints: "websecure"
      traefik.http.routers.proxy.tls: "true"
      traefik.http.routers.proxy.service: "api@internal"
    ports:
      # Bound to 127.0.0.1 by default - see TRAEFIK_WEB_BIND_ADDRESS.
      - "${TRAEFIK_WEB_BIND_ADDRESS:-127.0.0.1}:${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_WEB_BIND_ADDRESS:-127.0.0.1}:${TRAEFIK_HTTPS_PORT:-443}:443"
      # Database TCP entrypoints (Neo4j, MSSQL, MySQL, Postgres) are always
      # defined below, but only published when the matching override file is
      # added - see docker-compose.<db>.yml and README "TCP database routing".
    volumes:
      # Dynamic config (TLS certificates, extra routers)
      - ./dynamic:/etc/traefik/dynamic:ro
      # Mount only the leaf certificate and key. The copied CA certificate and
      # any unrelated files in certs/ are not needed by Traefik.
      - type: bind
        source: ${TRAEFIK_CERTIFICATE_FILE:-./certs/localtest.me.crt}
        target: /etc/traefik/certs/localtest.me.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TRAEFIK_CERTIFICATE_KEY_FILE:-./certs/localtest.me.key}
        target: /etc/traefik/certs/localtest.me.key
        read_only: true
        bind:
          create_host_path: false
    networks:
      - proxy
      - socket-proxy-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: traefik-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-net

networks:
  # proxy is created and owned by this compose project.
  # Other services reference it as an external network:
  #   networks:
  #     proxy:
  #       external: true
  #       name: proxy
  # Advanced: overriding TRAEFIK_NETWORK_NAME requires every already-configured
  # consuming project's own network name to change too, or discovery breaks.
  proxy:
    name: ${TRAEFIK_NETWORK_NAME:-proxy}

  # Internal-only network between Traefik and socket-proxy.
  socket-proxy-net:
    internal: true
