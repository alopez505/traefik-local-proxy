# HTTP-only static configuration for environments where local CA installation
# is not permitted.

api:
  dashboard: true
  insecure: false

ping: {}

log:
  level: INFO

accessLog: {}

providers:
  docker:
    exposedByDefault: false
    allowEmptyServices: true
    defaultRule: 'Host(`{{ index .Labels "traefik.hostname" }}.localtest.me`)'

entryPoints:
  web:
    address: ":80"
